<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>my brain</title>
</head>
<body>
    <section class="my-brain">
            <div class="section-header">
                <i class="fa-solid fa-arrow-left-long" id = "back"></i>
                <span class="brain-icon">🧠</span>
                <span class="section-title">MY BRAIN</span>
                <span class="status-line"></span>
            </div>

            <div class="brain-content">

                <div class="brain-block">
                    <span class="brain-label">CURRENTLY LEARNING</span>

                    <div class="brain-tags">
                        <span>JAVASCRIPT</span>
                        <span>C</span>
                        <span>PYTHON</span>
                        <span>AI</span>
                        <span>WEB DEV</span>
                    </div>
                </div>

                <div class="brain-block">
                    <span class="brain-label">CURRENTLY CURIOUS ABOUT</span>

                    <div class="brain-list">
                        <p>→ AI AGENTS</p>
                        <p>→ AUTOMATION</p>
                        <p>→ COMPILERS</p>
                        <p>→ HOW THINGS WORK</p>
                    </div>
                </div>

                <div class="brain-block">
                    <span class="brain-label">CURRENT OBSESSIONS</span>

                    <div class="brain-bars">

                        <div class="brain-bar">
                            <span>BUILDING THINGS</span>
                            <div class="bar">
                                <div class="bar-fill" style="width: 90%;"></div>
                            </div>
                        </div>

                        <div class="brain-bar">
                            <span>BREAKING THINGS</span>
                            <div class="bar">
                                <div class="bar-fill" style="width: 75%;"></div>
                            </div>
                        </div>

                        <div class="brain-bar">
                            <span>UNDERSTANDING WHY</span>
                            <div class="bar">
                                <div class="bar-fill" style="width: 95%;"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    <script src="my_brain.js"></script>
</body>
</html>
